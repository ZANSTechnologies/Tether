<html>

<head>
	<title>Tether Tech Demo</title>
	<script type="text/javascript" src="js/code.js"></script>
    <link href="css/styles.css" rel="stylesheet">	
    <link href="https://fonts.googleapis.com/css?family=Ubuntu" rel="stylesheet">
	
	<script type="text/javascript">
		// Will act once DOM is loaded, and 
		document.addEventListener('DOMContentLoaded', function() 
		{
			readCookie(); //< from code.js
		}, false);
	</script>	
</head>

<body>
<h1 id="landingPageTitle">Tether Tech Demo</h1>

<div id="loggedInDiv">
	<span id="userName"></span><br />
	<button type="button" id="logoutButton" class="buttons" onclick="doLogout();"> Log Out </button>
</div>

<div id="accessUIDiv">
	<br />

	<input type="text" id="searchText" placeholder="Contact To Search For"/>
	<button type="button" id="searchContactButton" class="buttons" onclick="searchContact();"> Search Contact </button><br />
	<span id="contactSearchResult"></span>
	<p id="contactList">
	</p><br /><br />

	<input type="text" id="addContactFirstName" class="addContactFields" placeholder="First Name...">
	<input type="text" id="addContactLastName" class="addContactFields" placeholder="Last Name...">
	<input type="text" id="addContactPhone" class="addContactFields"  placeholder="Phone #...">
	<input type="text" id="addContactEmail" class="addContactFields" placeholder="Email...">
	<button type="button" id="addContactButton" class="buttons" onclick="addContact();"> Add Contact </button><br />
	<span id="contactAddResult"></span>
</div>
</body>

</html>
