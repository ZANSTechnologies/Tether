<!DOCTYPE html>

<!--This file builds out the contacts dashboard. 
Users can search, add, edit, and delete contacts.-->

<html>
    <head>
        <title>Contact Manager - Dashboard</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="css/frutiger.css" rel="stylesheet">
        <script src="https://d3js.org/d3.v7.min.js"></script>
        <!-- ^ is used for graph view -->
        <script type="text/javascript" src="../js/globals.js"></script>
        <script type="text/javascript" src="../js/cookie.js"></script>
        <script type="text/javascript" src="../js/doLogout.js"></script>
        <script type="text/javascript" src="../js/searchContact.js"></script>
        <script type="text/javascript" src="../js/renderGraph.js"></script>
        <script type="text/javascript">
            // Will act once DOM is loaded, and 
            document.addEventListener('DOMContentLoaded', function() 
            {
                readCookie(); //< from cookie.js
            }, false);
	    </script>
    </head>
    <body>
        <div class="container mt-5">
            <div class="glass-card">


            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1>My Contacts</h1>
                <a class="btn btn-success" id="addContactBtn" href="addContact.html">+ Add Contact</a>
            </div>

            <div id="loggedInDiv">
                <span id="userName"></span><br />
                <button type="button" class="btn btn-danger" id="logoutButton" onclick="doLogout();"> Log Out </button>
            </div>
        
            <div class="mb-4">
                <input type="text" placeholder="Search contacts..." class="form-control" id="searchInput">
                <button type="button" id="searchContactButton" class="btn btn-primary" onclick="searchContact();"> Search Contact </button>
                <span id="contactSearchResult"></span><br />
            </div>

            <p id="contactList">
            </p><br /><br />

            <!-- Obsidian-like graph -->
            <div id="contactGraph" style="width:100%; height:500px; border:1px solid #37475b; border-radius:8px;"></div>
            <div id="contactDetail"></div> <!-- Shows contact info on click -->
            <div id="graphResult"></div>

            </div>
        </div>
    </body>
</html>
