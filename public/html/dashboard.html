<!DOCTYPE html>
<!--This file builds out the contacts dashboard.
Users can search, add, edit, and delete contacts.-->
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Tether - Dashboard</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="../css/frutiger.css" rel="stylesheet">
        <script src="https://d3js.org/d3.v7.min.js" defer></script>
        <script src="../js/globals.js" defer></script>
        <script src="../js/cookie.js" defer></script>
        <script src="../js/doLogout.js" defer></script>
        <script src="../js/deleteContact.js" defer></script>
        <script src="../js/searchContact.js" defer></script>
        <script src="../js/renderGraph.js" defer></script>
        <script src="../js/dashboard.js" defer></script>
    </head>
    <body>
        <main class="container mt-5">
            <div class="glass-card">

                <!-- Header row: title on the left, ONLY logout on the right.
                     Add Contact was moved down-left so it can't be fat-fingered
                     into a logout. -->
                <div class="d-flex justify-content-between align-items-start mb-4 flex-wrap gap-2">
                    <div>
                        <h1>My Contacts</h1>
                        <!-- Populated by readCookie() -->
                        <span id="userName" class="user-greeting"></span>
                    </div>
                    <button type="button" class="btn btn-failure" id="logoutButton">Log Out</button>
                </div>

                <!-- Contact management controls, grouped on the left -->
                <div class="d-flex align-items-center gap-3 mb-3 flex-wrap">
                    <a class="btn btn-success" href="addContact.html">+ Add Contact</a>
                    <div class="form-check form-switch mb-0">
                        <input class="form-check-input" type="checkbox" role="switch" id="contactListToggle">
                        <label class="form-check-label" for="contactListToggle">Show contact list</label>
                    </div>
                </div>

                <!-- Search (moved above the list: filter first, results below) -->
                <div class="mb-4">
                    <form id="searchForm" class="d-flex gap-2">
                        <label for="searchInput" class="visually-hidden">Search contacts</label>
                        <input type="text" placeholder="Search contacts..." class="form-control" id="searchInput">
                        <button type="submit" class="btn btn-primary">Search</button>
                    </form>
                    <span id="contactSearchResult" class="mt-2 d-block" role="status"></span>
                </div>

                <!-- Contact list wrapper, toggled by the switch above -->
                <div id="contactListWrapper">
                    <p class="list-legend"><strong>Name</strong>&nbsp;|&nbsp;Phone&nbsp;|&nbsp;Email</p>
                    <!-- Contact list populated by searchContact.js -->
                    <div id="contactList" class="mb-4"></div>
                </div>

                <!-- Delete result message -->
                <div id="deleteResult" class="text-center mb-3" role="status"></div>

                <!-- D3 contact graph -->
                <div id="contactGraph" style="width:100%; height:500px;" role="img" aria-label="Bubble graph of your contacts"></div>

                <!-- Contact detail on graph node click -->
                <div id="contactDetail" class="mt-3 text-center"></div>

            </div>
        </main>

        <!-- Delete confirmation modal. Shown by showDeleteModal() in dashboard.js. -->
        <div id="deleteModal" class="modal-overlay" hidden>
            <div class="glass-card modal-card" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle">
                <h2 id="deleteModalTitle" class="h4 mb-3">Delete Contact</h2>
                <p id="deleteModalText" class="mb-4"></p>
                <div class="d-flex gap-2 justify-content-end">
                    <button type="button" class="btn btn-outline-secondary" id="deleteModalCancel">Cancel</button>
                    <button type="button" class="btn btn-failure" id="deleteModalConfirm">Delete</button>
                </div>
            </div>
        </div>
    </body>
</html>
