<!DOCTYPE html>
<!--This file builds out the contacts dashboard.
Users can search, add, edit, and delete contacts.-->
<html>
    <head>
        <title>Tether - Dashboard</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="../css/frutiger.css" rel="stylesheet">
        <script src="https://d3js.org/d3.v7.min.js"></script>
        <script type="text/javascript" src="../js/globals.js"></script>
        <script type="text/javascript" src="../js/cookie.js"></script>
        <script type="text/javascript" src="../js/doLogout.js"></script>
        <script type="text/javascript" src="../js/deleteContact.js"></script>
        <script type="text/javascript" src="../js/searchContact.js"></script>
        <script type="text/javascript" src="../js/renderGraph.js"></script>
        <script type="text/javascript">
            document.addEventListener('DOMContentLoaded', function()
            {
                readCookie();
 
                // Restore toggle state from localStorage so preference persists across
                // page loads. Defaults to visible (checked) if no saved preference.
                const saved = localStorage.getItem('contactListVisible');
                const toggle = document.getElementById('contactListToggle');
                const visible = saved === null ? true : saved === 'true';
                toggle.checked = visible;
                document.getElementById('contactListWrapper').style.display = visible ? '' : 'none';
            }, false);
 
            function handleContactListToggle(checkbox)
            {
                const wrapper = document.getElementById('contactListWrapper');
                wrapper.style.display = checkbox.checked ? '' : 'none';
                localStorage.setItem('contactListVisible', checkbox.checked);
            }
        </script>
 
        <style>
            /* Toggle switch styling — scoped here so it doesn't pollute frutiger.css */
            .list-toggle-row {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                margin-bottom: 0.5rem;
                font-size: 1.0rem;
                color: #5a5f7a;
                user-select: none;
            }
            .form-check-input:checked {
                background-color: #1a7ed5;
                border-color: #1a7ed5;
            }
        </style>
    </head>
    <body>
        <div class="container mt-5">
            <div class="glass-card">

                <!-- Header row: title and add button -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h1>My Contacts</h1>
                        <!-- Populated by readCookie() -->
                        <span id="userName" class="text-muted"></span>
                    </div>
                    <div>
                        <a class="btn btn-success me-2" href="addContact.html">+ Add Contact</a>
                        <button type="button" class="btn btn-danger" id="logoutButton" onclick="doLogout();">Log Out</button>
                    </div>
                </div>

                <!-- Contact list toggle -->
                <div class="list-toggle-row">
                    <div class="form-check form-switch mb-0">
                        <input
                            class="form-check-input"
                            type="checkbox"
                            role="switch"
                            id="contactListToggle"
                            onchange="handleContactListToggle(this)"
                        >
                        <label class="form-check-label" for="contactListToggle">
                            Show contact list
                        </label>
                    </div>
                </div>
 
                <!-- Contact list wrapper — toggled by the switch above -->
                <div id="contactListWrapper">
                    <p style="margin-bottom: 20px;">
                        <strong><em>first last</em></strong>&nbsp;|&nbsp;#&nbsp;|&nbsp;email
                    </p>
 
                    <!-- Contact list populated by searchContact.js -->
                    <div id="contactList" class="mb-4"></div>
                </div>

                <!-- Search bar -->
                <div class="mb-4">
                    <div class="d-flex gap-2">
                        <input type="text" placeholder="Search contacts..." class="form-control" id="searchInput">
                        <button type="button" class="btn btn-primary" onclick="searchContact();">Search</button>
                    </div>
                    <span id="contactSearchResult" class="mt-2 d-block"></span>
                </div>

                <!-- Contact list populated by searchContact.js -->
                <div id="contactList" class="mb-4"></div>

                <!-- Delete result message -->
                <div id="deleteResult" class="text-center mb-3"></div>

                <!-- D3 contact graph -->
                <div id="contactGraph" style="width:100%; height:500px;"></div>

                <!-- Contact detail on graph node click -->
                <div id="contactDetail" class="mt-3 text-center"></div>

            </div>
        </div>
    </body>
</html>
