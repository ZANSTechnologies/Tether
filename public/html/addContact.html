<!DOCTYPE html>
<!--This page allows you to add a contact to your contact list.
It works in tandem with AddContact.php API.-->
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Tether - Add Contact</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="../css/frutiger.css" rel="stylesheet">
        <script src="../js/globals.js" defer></script>
        <script src="../js/cookie.js" defer></script>
        <script src="../js/addContact.js" defer></script>
    </head>
    <body>
        <main class="container mt-5">
            <div class="glass-card">

                <!-- Header row: title and back button -->
                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                    <div>
                        <h1>Add Contact</h1>
                        <!-- Populated by readCookie() -->
                        <span id="userName" class="user-greeting"></span>
                    </div>
                    <a class="btn btn-outline-secondary" href="dashboard.html">Back to Dashboard</a>
                </div>

                <div class="row justify-content-center">
                    <div class="col-md-6 col-lg-5">
                        <form id="addContactForm" novalidate>
                            <label for="addContactFirstName" class="visually-hidden">First name</label>
                            <input type="text" placeholder="First Name" class="form-control mb-3" id="addContactFirstName">
                            <label for="addContactLastName" class="visually-hidden">Last name</label>
                            <input type="text" placeholder="Last Name" class="form-control mb-3" id="addContactLastName">
                            <label for="addContactPhone" class="visually-hidden">Phone</label>
                            <input type="tel" placeholder="Phone" class="form-control mb-3" id="addContactPhone" autocomplete="off">
                            <label for="addContactEmail" class="visually-hidden">Email</label>
                            <input type="email" placeholder="Email" class="form-control mb-3" id="addContactEmail" autocomplete="off">
                            <button type="submit" class="btn btn-success w-100" id="addContactButton">Add Contact</button>
                        </form>
                        <div id="contactAddResult" class="mt-3 text-center" role="alert"></div>
                    </div>
                </div>

            </div>
        </main>
    </body>
</html>
