<!DOCTYPE html>
<!-- This page allows you to add a contact to your contact list. -->
<!-- Uses the AddContact.php API. -->

<html>
    <head>
        <title>Contact Manager - Add Contact</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="css/frutiger.css" rel="stylesheet">
        <script type="text/javascript" src="../js/globals.js"></script>
        <script type="text/javascript" src="../js/cookie.js"></script>
        <script type="text/javascript" src="../js/addContact.js" defer></script>
    </head>
    <body>
        <div class="container mt-5">
            <div class="glass-card">

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h1>Add Contact</h1>
                        <span id="userName" class="text-muted"></span>
                    </div>
                    <a class="btn btn-outline-secondary" href="dashboard.html">Back to Dashboard</a>
                </div>

                <div class="row justify-content-center">
                    <div class="col-md-6 col-lg-5">
                        <form id="addContactForm">
                            <input type="text" placeholder="First Name" class="form-control mb-3" id="addContactFirstName">
                            <input type="text" placeholder="Last Name" class="form-control mb-3" id="addContactLastName">
                            <input type="text" placeholder="Phone" class="form-control mb-3" id="addContactPhone">
                            <input type="email" placeholder="Email" class="form-control mb-3" id="addContactEmail">
                            <button type="submit" class="btn btn-success w-100" id="addContactButton">Add Contact</button>
                        </form>

                    <div id="contactAddResult" class="mt-3 text-center"></div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
