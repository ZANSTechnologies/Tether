<!DOCTYPE html>

<!--This file builds out the contacts dashboard. 
Users can search, add, edit, and delete contacts.-->

<html>
    <head>
        <title>Contact Manager - Dashboard</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <div class="container mt-5">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1>My Contacts</h1>
                <a class="btn btn-success" id="addContactBtn" href="addContact.html">+ Add Contact</a>
            </div>
        
            <div class="mb-4">
                <input type="text" placeholder="Search contacts..." class="form-control" id="searchInput">
            </div>

            <div id="contactList">
                <!--Contacts will be dynamically loaded here by JavaScript.-->
            </div>

        </div>
    </body>
</html>
