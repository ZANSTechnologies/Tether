<!DOCTYPE html>
<!--This file builds out the register page 
when a new user needs to create a username and password-->

<html>
    <head>
        <title>Contact Manager - Register</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="css/frutiger.css" rel="stylesheet">
        <script type="text/javascript" src="js/globals.js"></script>
        <script type="text/javascript" src="js/cookie.js"></script>
        <script type="text/javascript" src="js/registerUser.js" defer></script>
    </head>
    <body>
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-4">
                    <div class="glass-card">

                        <h1 class="text-center">Register</h1>
                        <input type="text" placeholder="Username" class="form-control mb-3" id="username">
                        <input type="text" placeholder="FirstName" class="form-control mb-3" id="first">
                        <input type="text" placeholder="LastName" class="form-control mb-3" id="last">
                        <input type="password" placeholder="Password" class="form-control mb-3" id="password">
                        <input type="password" placeholder="Confirm Password" class="form-control mb-3" id="confirmPassword">
                        <span id="registerResult"></span>
                        <button class="btn btn-primary w-100" id="registerBtn" onclick="registerUser();">Register</button>
                        <p class="text-center mt-3">Already have an account? <a href="index.html">Log In</a></p>
                
                    </div>
                 </div>
            </div>
        </div>
    </body>
</html>
