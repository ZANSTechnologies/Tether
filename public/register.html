<!DOCTYPE html>
<!--This file builds out the register page 
when a new user needs to create a username and password-->

<html>
    <head>
        <title>Contact Manager - Register</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-4">
                    <h1 class="text-center">Register</h1>
                    <input type="text" placeholder="Username" class="form-control mb-3" id="username">
                    <input type="email" placeholder="Email" class="form-control mb-3" id="email">
                    <input type="password" placeholder="Password" class="form-control mb-3" id="password">
                    <input type="password" placeholder="Confirm Password" class="form-control mb-3" id="confirmPassword">
                    <button class="btn btn-primary w-100" id="registerBtn">Register</button>
                    <p class="text-center mt-3">Already have an account? <a href="indexBlue.html">Log In</a></p>
                </div>
            </div>
        </div>
    </body>
</html>
