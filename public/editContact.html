<!DOCTYPE html>
<!--This page allows you to edit an existing contact. 
It works in tandem with UpdateContact.php API.-->
<html>
    <head>
        <title>Contact Manager - Edit Contact</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="css/frutiger.css" rel="stylesheet">
        <script type="text/javascript" src="js/globals.js"></script>
        <script type="text/javascript" src="js/cookie.js"></script>
        <script type="text/javascript" src="js/updateContact.js"></script>
        <script type="text/javascript" src="js/editContact.js" defer></script>
    </head>
    <body>
        <div class="container mt-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="glass-card">

                <div>
                    <h1>Edit Contact</h1>
                    <span id="userName" class="text-muted"></span>
                </div>
                <a class="btn btn-outline-secondary" href="dashboard.html">Back to Dashboard</a>
            </div>
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <form id="editContactForm">
                        <input type="text" placeholder="First Name" class="form-control mb-3" id="editContactFirstName">
                        <input type="text" placeholder="Last Name" class="form-control mb-3" id="editContactLastName">
                        <input type="text" placeholder="Phone" class="form-control mb-3" id="editContactPhone">
                        <input type="email" placeholder="Email" class="form-control mb-3" id="editContactEmail">
                        <div id="updateResult"></div>
                        <button type="submit" class="btn btn-primary w-100 mt-2" id="editContactButton">Save Changes</button>
                    </form>
                    <div id="contactEditResult" class="mt-3 text-center"></div>
                </div>
                </div>
            </div>
        </div>
    </body>
</html>
