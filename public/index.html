<!DOCTYPE html>
<!--Tether login page. Works in tandem with Login.php.-->
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Tether - Login</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="css/frutiger.css" rel="stylesheet">
        <script src="js/globals.js" defer></script>
        <script src="js/cookie.js" defer></script>
        <script src="js/doLogin.js" defer></script>
    </head>
    <body>
        <main class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-4">
                    <div class="glass-card">
                        <h1 class="text-center mb-4">Login</h1>
                        <form id="loginForm" novalidate>
                            <label for="username" class="visually-hidden">Username</label>
                            <input type="text" placeholder="Username" class="form-control mb-3" id="username" autocomplete="username">
                            <label for="password" class="visually-hidden">Password</label>
                            <input type="password" placeholder="Password" class="form-control mb-3" id="password" autocomplete="current-password">
                            <span id="loginResult" class="d-block mb-3 text-center" role="alert"></span>
                            <button type="submit" class="btn btn-primary w-100" id="loginBtn">Log In</button>
                        </form>
                        <p class="text-center mt-3">Don't have an account? <a href="html/register.html">Register</a></p>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
