<!DOCTYPE html>
<html>
    <head>
        <title>Tether - Login</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="css/frutiger.css" rel="stylesheet">
        <script type="text/javascript" src="js/globals.js"></script>
        <script type="text/javascript" src="js/cookie.js"></script>
        <script type="text/javascript" src="js/doLogin.js" defer></script>
    </head>
    <body>
        <div class="container mt-5">   
            <div class="row justify-content-center">
                <div class="col-md-4">
                    <div class="glass-card">
                        <h1 class="text-center mb-4">Login</h1>
                        <input type="text" placeholder="Username" class="form-control mb-3" id="username">
                        <input type="password" placeholder="Password" class="form-control mb-3" id="password">
                        <span id="loginResult" class="d-block mb-3 text-center"></span>
                        <button class="btn btn-primary w-100" id="loginBtn" onclick="doLogin();">Log In</button>
                        <p class="text-center mt-3">Don't have an account? <a href="html/register.html">Register</a></p>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
