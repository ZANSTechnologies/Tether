<!DOCTYPE html>

<html>
    <head>
        <title>Contact Manager</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">    
    </head>
    <body>
        <div class="container mt-5">   
            <div class="row justify-content-center">
                <div class="col-md-4"> 
                    <h1 class="text-center">Login</h1>
                    <input type="text" placeholder="Username" class="form-control mb-3" id="username">
                    <input type="password" placeholder="Password" class="form-control mb-3" id="password">
                    <button class="btn btn-primary w-100" id="loginBtn">Log In</button>
                    <!--href="#" is a placeholder for register page later-->
                    <p class="text-center mt-3">Don't have an account? <a href="#">Register</a></p>
                </div>
            </div>
        </div>

        <script>
            document.getElementById('loginBtn').addEventListener('click', function() 
            {
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                
                console.log(username, password);
            });
        </script>
    </body>
</html>
