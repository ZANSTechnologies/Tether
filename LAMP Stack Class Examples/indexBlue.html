<!DOCTYPE html>

<html>
    <head>
        <title>Contact Manager</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">    
    </head>
    <body>
        <div class="container mt-5">   
            <div class="row justify-content-center">
                <div class="col-md-4"> 
                    <h1 class="text-center">Login</h1>
                    <input type="text" placeholder="Username" class="form-control mb-3">
                    <input type="password" placeholder="Password" class="form-control mb-3">
                    <button class="btn btn-primary w-100">Log In</button>
                    <!--href="#" is a placeholder for register page later-->
                    <p class="text-center mt-3">Don't have an account? <a href="#">Register</a></p>
                </div>
            </div>
        </div>
    </body>
</html>
